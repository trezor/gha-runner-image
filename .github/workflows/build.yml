name: Build runner image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/trezor/gha-runner-image

jobs:
  build:
    runs-on: trezor-hq-selfhosted
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Tags follow the runner version baked into the Dockerfile, so the
      # image tag always tells you which runner version it contains.
      # Strips an optional @sha256 digest suffix (added by Renovate).
      - name: Read runner version from Dockerfile
        id: version
        run: |
          runner_version=$(sed -n 's|^FROM ghcr.io/actions/actions-runner:\([^@ ]*\).*|\1|p' Dockerfile)
          if [ -z "$runner_version" ]; then
            echo "Could not parse runner version from Dockerfile FROM line" >&2
            exit 1
          fi
          echo "runner=$runner_version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.runner }}
