name: Build runner image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/trezor/gha-runner-image

jobs:
  build:
    name: build (${{ matrix.variant }})
    runs-on: trezor-hq-selfhosted
    # One leg per variant, both scheduled at once on their own runner.
    # fail-fast keeps a failure in one leg from cancelling the other: each
    # tag is published (or not) on its own, and both results are reported.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Unpatched - for pools without ACTIONS_RESULTS_URL/ACTIONS_CACHE_URL.
          - variant: unpatched
            build_arg: GHAC_PATCH=false
            tag_suffix: ""
          # ghac-patched - requires ACTIONS_RESULTS_URL/ACTIONS_CACHE_URL in
          # the runner pod env (see Dockerfile note); tag suffix -gha-patched.
          - variant: patched
            build_arg: GHAC_PATCH=true
            tag_suffix: "-gha-patched"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Tags follow the runner version baked into the Dockerfile, so the
      # image tag always tells you which runner version it contains.
      # Strips an optional @sha256 digest suffix (added by Renovate).
      - name: Read runner version from Dockerfile
        id: version
        run: |
          runner_version=$(sed -n 's|^FROM ghcr.io/actions/actions-runner:\([^@ ]*\).*|\1|p' Dockerfile)
          if [ -z "$runner_version" ]; then
            echo "Could not parse runner version from Dockerfile FROM line" >&2
            exit 1
          fi
          echo "runner=$runner_version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Variant comes from the matrix: GHAC_PATCH=false tags the plain
      # <version> image, GHAC_PATCH=true the <version>-gha-patched one.
      - name: Build and push image (${{ matrix.variant }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: ${{ matrix.build_arg }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.runner }}${{ matrix.tag_suffix }}

  # Renovate automerges base bumps without pre-merge checks, so the patch
  # guard fires post-merge: red main must announce itself or a missing image
  # tag stays invisible until deprecation day.
  report-failure:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE='Runner image build failed on main'
          BODY="Automerged bump failed to build after merge: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} - the failing variant's tag was NOT published (image tags for this commit: <version>, <version>-gha-patched)."
          ISSUE=$(gh issue list --state open --label build-failure --json number,title \
            --jq '.[] | select(.title == "'"$TITLE"'") | .number' | head -1 || true)
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$BODY"
          else
            gh label create build-failure --color B60205 --force
            NUMBER=$(gh issue create --title "$TITLE" --label build-failure --body "$BODY" | grep -oE '[0-9]+$')
            # best-effort: a token without org read must not cost us the issue itself
            gh issue edit "$NUMBER" --add-team trezor/platform-devops \
              || echo "::warning::assigned to no one - could not assign @trezor/platform-devops to issue #${NUMBER}"
          fi
