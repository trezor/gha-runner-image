name: Build runner image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/trezor/gha-runner-image

jobs:
  build:
    runs-on: trezor-hq-selfhosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Tags follow the runner version baked into the Dockerfile, so the
      # image tag always tells you which runner version it contains.
      # Strips an optional @sha256 digest suffix (added by Renovate).
      - name: Read runner version from Dockerfile
        id: version
        run: |
          runner_version=$(sed -n 's|^FROM ghcr.io/actions/actions-runner:\([^@ ]*\).*|\1|p' Dockerfile)
          if [ -z "$runner_version" ]; then
            echo "Could not parse runner version from Dockerfile FROM line" >&2
            exit 1
          fi
          echo "runner=$runner_version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.runner }}
